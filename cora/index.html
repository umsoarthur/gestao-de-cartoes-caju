<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Case Caju · Melhorias nos fluxos de gestão de cartões · Arthur Magalhães</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
html,body{margin:0;background:#F7F7F7}
.senha-campo{transition:border-color 200ms ease,box-shadow 200ms ease}
.senha-campo:focus{outline:none;border-color:#FE3E6D !important;box-shadow:0 0 0 4px rgba(254,62,109,0.12)}
.senha-btn{transition:background-color 200ms ease,transform 200ms ease}
.senha-btn:hover{background:#E5285A !important}
.senha-btn:focus-visible,.olho:focus-visible{outline:2px solid #FE3E6D;outline-offset:3px}
@keyframes surgeModal{from{opacity:0;transform:translateY(16px) scale(0.98)}to{opacity:1;transform:none}}
@keyframes treme{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
@keyframes treme2{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.modal-senha{animation:surgeModal 500ms cubic-bezier(0.22,1,0.36,1) both}
.modal-senha.erroA{animation:treme 360ms ease}
.modal-senha.erroB{animation:treme2 360ms ease}
@media (prefers-reduced-motion: reduce){.modal-senha,.modal-senha.erroA,.modal-senha.erroB{animation:none}}
button{font:inherit}
button:focus-visible{outline:2px solid #FE3E6D;outline-offset:3px}
.tela{position:absolute;inset:0;display:block;width:375px;height:812px;transition:opacity 320ms ease;pointer-events:none}
.hs{position:absolute;padding:0;border:0;background:transparent;cursor:pointer;border-radius:10px;z-index:2}
.hs:focus-visible{outline:2px solid #3767E1;outline-offset:2px}
@media (prefers-reduced-motion: reduce){.tela{transition:none}}
button{font:inherit}
button:focus-visible{outline:2px solid #FE3E6D;outline-offset:3px}
.trilha-inv{--p:max(40px, calc(50vw - 600px));scroll-snap-type:x proximity;scroll-behavior:smooth;scrollbar-width:thin;scrollbar-color:#E2E2E2 transparent;overscroll-behavior-x:contain}
.trilha-inv::-webkit-scrollbar{height:6px}
.trilha-inv::-webkit-scrollbar-thumb{background:#E2E2E2;border-radius:999px}
.trilha-inv:focus-visible{outline:2px solid #FE3E6D;outline-offset:-2px}
.parada{scroll-snap-align:start;scroll-margin-left:var(--p)}
.seta-inv{transition:background-color 200ms ease,color 200ms ease,border-color 200ms ease}
.seta-inv:hover{background:#1A1A1A !important;color:#FFFFFF !important;border-color:#1A1A1A !important}
@media (prefers-reduced-motion: reduce){.trilha-inv{scroll-behavior:auto}}
.contato{transition:background-color 200ms ease,color 200ms ease}
.contato:hover{background:#FFFFFF !important;color:#4A1F2C !important}
.contato:focus-visible{outline:2px solid #FFFFFF;outline-offset:3px}
button{font:inherit}
button:focus-visible{outline:2px solid #FE3E6D;outline-offset:3px}
@keyframes revela{from{opacity:0;transform:translateY(16px) scale(0.98)}to{opacity:1;transform:none}}
.revelado{animation:revela 520ms cubic-bezier(0.22,1,0.36,1) both}
.oculto:hover{border-color:#FE3E6D !important;color:#FE3E6D !important}
@media (prefers-reduced-motion: reduce){.revelado{animation:none}}
a{color:#3E3E3E}a:hover{color:#FE3E6D}
@keyframes cresce{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes surge{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.coluna{transform-origin:bottom;animation:cresce 900ms cubic-bezier(0.22,1,0.36,1) both}
.coluna-conteudo{animation:surge 500ms ease both}
@media (prefers-reduced-motion: reduce){.coluna,.coluna-conteudo{animation:none}}
a{color:#1A1A1A}a:hover{color:#FE3E6D}
button{font:inherit}
button:focus-visible{outline:2px solid #FE3E6D;outline-offset:3px}
@keyframes ponto1{0%,24%{opacity:0}25%,100%{opacity:1}}
@keyframes ponto2{0%,49%{opacity:0}50%,100%{opacity:1}}
@keyframes ponto3{0%,74%{opacity:0}75%,100%{opacity:1}}
.ponto-1{animation:ponto1 1.6s steps(1,end) infinite}
.ponto-2{animation:ponto2 1.6s steps(1,end) infinite}
.ponto-3{animation:ponto3 1.6s steps(1,end) infinite}
@keyframes pulsaDesbloqueio{0%,100%{box-shadow:0 0 0 0 rgba(254,62,109,0.35)}50%{box-shadow:0 0 0 6px rgba(254,62,109,0)}}
.desbloqueio-ponto{animation:pulsaDesbloqueio 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.desbloqueio-ponto,.ponto-1,.ponto-2,.ponto-3{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<noscript>Esta apresentação precisa de JavaScript para funcionar.</noscript>

</body>
</html>
